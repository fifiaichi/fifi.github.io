    <style>
        html { scroll-behavior: smooth; }
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            z-index: 100;
            width: 0%;
            transition: width 0.1s linear;
        }
        .back-to-top {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 90;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(102,126,234,0.35);
        }
        .back-to-top.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .back-to-top:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(102,126,234,0.5);
        }
        /* 骨架屏加载 */
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite;
            border-radius: 8px;
        }
        .dark .skeleton {
            background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
            background-size: 200% 100%;
        }
        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* 图片淡入 */
        img.lazy-fade {
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        img.lazy-fade.loaded {
            opacity: 1;
        }
        /* 卡片入场动画 */
        .card-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .card-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        /* 统一区块标题下划线 */
        .section-title {
            position: relative;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        .section-title-center::after {
            left: 50%;
            transform: translateX(-50%);
        }
    </style>

    <script>
        // ==================== 全局函数 ====================

        // 图片预览
        let currentImageIndex = 0;
        let projectImages = [];

        function openImageModal(imgSrc, index = -1) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('image-modal-img');
            const content = document.getElementById('image-modal-content');

            img.src = imgSrc;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
            document.body.style.overflow = 'hidden';
            scale = 1;
            img.style.transform = 'scale(1)';

            const currentId = new URLSearchParams(window.location.search).get('id') || 'tian-gong-zao-wu';
            const project = projectData[currentId];
            if (project && project.images) {
                projectImages = project.images;
                currentImageIndex = index >= 0 ? index : projectImages.indexOf(imgSrc);
            }
        }

        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            const content = document.getElementById('image-modal-content');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        function prevImage() {
            if (projectImages.length > 0) {
                currentImageIndex = (currentImageIndex - 1 + projectImages.length) % projectImages.length;
                const img = document.getElementById('image-modal-img');
                img.src = projectImages[currentImageIndex];
                scale = 1;
                img.style.transform = 'scale(1)';
            }
        }

        function nextImage() {
            if (projectImages.length > 0) {
                currentImageIndex = (currentImageIndex + 1) % projectImages.length;
                const img = document.getElementById('image-modal-img');
                img.src = projectImages[currentImageIndex];
                scale = 1;
                img.style.transform = 'scale(1)';
            }
        }

        document.addEventListener('keydown', function(e) {
            const modal = document.getElementById('image-modal');
            if (!modal.classList.contains('hidden')) {
                if (e.key === 'ArrowLeft') { e.preventDefault(); prevImage(); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); nextImage(); }
            }
        });

        let scale = 1;
        function zoomImage(delta) {
            const img = document.getElementById('image-modal-img');
            scale = Math.max(0.5, Math.min(3, scale + delta));
            img.style.transform = `scale(${scale})`;
        }
        function resetZoom() {
            scale = 1;
            document.getElementById('image-modal-img').style.transform = 'scale(1)';
        }

        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function goBack() {
            const hasReferrer = document.referrer && document.referrer.includes(window.location.hostname);
            if (hasReferrer && document.referrer.includes('index.html')) {
                window.location.href = 'index.html#works';
            } else if (hasReferrer && document.referrer.includes('animation-list.html')) {
                window.location.href = 'animation-list.html';
            } else {
                window.location.href = 'index.html#works';
            }
        }

        function handleVideoError(projectId, posterUrl) {
            const loadingEl = document.getElementById('video-loading-' + projectId);
            const playerEl = document.getElementById('video-player-' + projectId);
            if (loadingEl) loadingEl.style.display = 'none';
            if (playerEl) {
                playerEl.innerHTML = `
                    <div class="relative w-full aspect-video bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 flex items-center justify-center">
                        <div class="text-center p-8">
                            <div class="w-20 h-20 mx-auto mb-6 bg-gray-800 rounded-2xl flex items-center justify-center border border-gray-700">
                                <i class="fa fa-film text-4xl text-gray-600"></i>

            // 重新初始化图片淡入
            setTimeout(() => {
                document.querySelectorAll('img').forEach(img => {
                    if (!img.classList.contains('lazy-fade') && !img.closest('#cert-modal') && !img.closest('#image-modal')) {
                        img.classList.add('lazy-fade');
                        if (img.complete && img.naturalWidth > 0) {
                            img.classList.add('loaded');
                        } else {
                            img.addEventListener('load', () => img.classList.add('loaded'));
                            img.addEventListener('error', () => { img.style.opacity = '0.4'; img.classList.add('loaded'); });
                        }
                    }
                });
            }, 100);
        }
    </script>
</body>
</html>
